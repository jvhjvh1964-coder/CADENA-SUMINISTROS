<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>Juego: Cadena de suministro</title>

<style>
:root{font-family:Arial,sans-serif;
color:white;
background:#07152e}*{box-sizing:border-box}body{margin:0;
min-height:100vh;
display:flex;
flex-direction:column;
background:linear-gradient(135deg,#07152e,#17396b)}

header{text-align:center;padding:17px;background:#050b1c}
h1{margin:0;font-size:clamp(25px,4vw,46px)}
.sub{margin:6px}
.stats{display:flex;flex-wrap:wrap;gap:10px;justify-content:center;padding:15px}
.stat{border:2px solid #7caaff;background:#102449;border-radius:13px;padding:12px 19px;font-size:clamp(18px,2.6vw,25px);font-weight:bold}

/*.main{width:min(980px,96%);margin:auto;text-align:center;padding:20px;border-radius:22px;border:3px solid #62a7ff;background:#10264d;box-shadow:0 0 22px #327af7}*/
.main{
  width:min(1200px,98%);
  margin:auto;
  text-align:center;
  padding:30px;
  border-radius:22px;
  border:3px solid #62a7ff;
  background:#10264d;
  box-shadow:0 0 22px #327af7
}


.counter{font-size:23px;color:#ffde72;font-weight:bold}
.picture{width:180px;height:155px;object-fit:contain;background:white;border:5px solid #fff;border-radius:18px;margin:12px auto;display:block}

/*.question{font-size:clamp(23px,3.2vw,35px);font-weight:900;margin:16px auto 22px;max-width:900px}*/

.question{
/*font-size:clamp(28px,4vw,44px);*/
  font-size:clamp(23px,3.2vw,35px);

  font-weight:900;
  margin:22px auto 28px;

/*max-width:100%;*/
  max-width:1200px;

  min-height:150px;

  padding:28px 22px;
  display:flex;
  align-items:center;
  justify-content:center;
  text-align:center;
  line-height:1.35;
  color:white;
  background:#07152e;
  border:4px solid #ffeb00;
  border-radius:22px;
  box-shadow:0 0 18px #ffeb0080;
}

.answers{display:grid;grid-template-columns:1fr;gap:13px}
.answer{border:3px solid white;border-radius:16px;padding:18px 12px;color:white;font-size:clamp(21px,2.7vw,30px);font-weight:900;cursor:pointer;min-height:72px;text-shadow:1px 2px 3px #0008;transition:transform .15s}
.answer:hover:not(:disabled){transform:scale(1.025);filter:brightness(1.16)}
.answer:disabled{cursor:not-allowed;opacity:.7}


.red{
  background:#d3182c;
  color:white;
}

.blue{
  background:#164cd6;
  color:white;
}

.black{
  background:#111;
  color:white;
}

.green{
  background:#07843d;
  color:white;
}

.yellow{
  background:#ffeb00;
  color:#000; /* letra negra */
  text-shadow:none;
  border-color:#fff;
}

.aqua{
  background:aqua;
  color:#000; /* letra negra */
  text-shadow:none;
  border-color:#fff;
}

footer{text-align:center;font-size:clamp(13px,2vw,14px);font-weight:normal;color:silver;background:#050b1c;padding:17px;margin-top:22px}
.overlay{position:fixed;inset:0;display:flex;align-items:center;justify-content:center;background:#000b;z-index:10}.overlay[hidden]{display:none}

.symbol{font-size:clamp(100px,22vw,260px);line-height:1;animation:zoom .3s ease-out both}
.symbol.good{color:#1476ff;filter:drop-shadow(0 0 15px #2daaff)}
.symbol.bad{color:#f02034;filter:drop-shadow(0 0 15px #ff3651)}

.start{animation:truck 1s ease-in-out both}

.final{padding:38px 55px;border:6px solid #ffd400;border-radius:24px;background:#071b40;text-align:center;box-shadow:0 0 30px #ffdb00;color:#fff}
.final 
.label{font-size:clamp(27px,5vw,55px);font-weight:900}
.final .grade{font-size:clamp(85px,17vw,170px);
font-weight:900;color:#ffe500;
text-shadow:0 0 22px #ffb900}

@keyframes zoom{from{transform:scale(.1);
opacity:.1}to{transform:scale(1);
opacity:1}}@keyframes truck{0%{transform:scale(.08);
opacity:0}100%{transform:scale(5) rotate(10deg);
opacity:1}}@media(min-width:760px){.answers{grid-template-columns:repeat(3,1fr)}}


/* VENTANA INICIAL CON LA IMAGEN DE LA CADENA */
.intro-overlay{
  position:fixed;
  inset:0;
  z-index:20;
  display:flex;
  align-items:center;
  justify-content:center;
  padding:15px;
  background:rgba(0,0,0,.88);
}

.intro-overlay[hidden]{
  display:none;
}

.intro-box{
  width:min(720px,96vw);
  max-height:94vh;
  overflow-y:auto;
  padding:22px;
  text-align:center;
  background:#10264d;
  border:4px solid #ffeb00;
  border-radius:24px;
  box-shadow:0 0 30px #ffeb00;
  animation:zoom .35s ease-out both;
}

.intro-title{
  margin:0 0 12px;
  color:#ffeb00;
  font-size:clamp(24px,4vw,38px);
  font-weight:900;
}

.intro-image{
  display:block;
  width:100%;
  max-height:65vh;
  object-fit:contain;
  margin:0 auto 18px;
  background:white;
  border:3px solid white;
  border-radius:12px;
}

.intro-text{
  color:white;
  font-size:clamp(17px,2.5vw,23px);
  font-weight:bold;
  margin:12px 0 20px;
}

.intro-button{
  display:block;
  width:100%;
  padding:17px;
  color:#000;
  background:#ffeb00;
  border:3px solid white;
  border-radius:15px;
  font-size:clamp(23px,3vw,32px);
  font-weight:900;
  cursor:pointer;
  box-shadow:0 0 15px #ffeb00;
}

.intro-button:hover{
  background:#fff;
  transform:scale(1.02);
}


</style>
</head>
<body>
<header>
<h1>🚚 CADENA DE SUMINISTROS</h1>
<p class="sub">INSUCO de Talca · Administración Logística</p>
</header>

<section class="stats">
<div class="stat">⏳ <span id="time">120</span> s</div>
<div class="stat">✔️ <span id="right">0</span></div>
<div class="stat">❌ <span id="wrong">0</span></div>
<div class="stat">📝 <span id="done">0</span>/50</div>
</section>

<main class="main">
<img class="picture" id="picture" alt="Ilustración de la etapa">
<div class="question" id="question"></div>
<div class="answers" id="answers"></div>
</main>

<footer>DERECHOS DE AUTOR | PROFESOR JOSÉ VEGA HERRERA (2026)</footer>

<div class="overlay" id="overlay">
	<div id="popup" class="symbol start">🚚</div>
</div>


<!-- VENTANA DE BIENVENIDA -->
<div class="intro-overlay" id="introOverlay">
  <div class="intro-box">

    <h2 class="intro-title">
      🚚 CADENA DE SUMINISTROS
    </h2>

    <img
      class="intro-image"
      src="CADENA_SUMINISTROS.png"
      alt="Diagrama de las ocho etapas de la cadena de suministros"
    >

    <p class="intro-text">
      Observa las 8 etapas de la cadena de suministros
      antes de comenzar el desafío.
    </p>

    <button
      type="button"
      class="intro-button"
      id="acceptButton"
    >
      ACEPTAR
    </button>

  </div>
</div>


<script>
'use strict';
const stages=['Materias primas','Producción','Transporte','Agencias o Sucursales','Almacenamiento','Venta','Facturación','Entregas'];
const questions=[];

function add(stage,prompt){
questions.push({stage,prompt})
}

/*==============================================================*/
/*     50 PREGUNTAS sobre Cadena de Suministros                 */
/*==============================================================*/
[
['Materias primas',['¿Qué significa en español: "RAW MATERIALS"?','¿En qué etapa se obtienen los recursos necesarios para fabricar productos?','¿Dónde comienza el flujo de insumos de la cadena?','¿Qué etapa suministra madera, minerales o cultivos para elaborar bienes?','¿Qué etapa corresponde a los proveedores de insumos básicos?']],

['Producción',['¿Qué significa en español: "PRODUCTION"?','¿En qué etapa se transforman insumos en productos terminados?','¿Qué etapa incluye procesos de fabricación?','¿Dónde se ensamblan o elaboran los artículos?','¿Qué etapa convierte materias primas en bienes?']],

['Transporte',['¿Qué significa en español: "TRANSPORT"?','¿Qué etapa desplaza mercaderías entre instalaciones?','¿Se utilizan camiones, trenes, barcos o aviones para trasladar cargas?','¿Qué etapa conecta físicamente distintos puntos logísticos?','¿Qué etapa planifica el movimiento de carga entre lugares?']],

['Agencias o Sucursales',['¿Qué significa en español: "AGENCY or BRANCH OFFICE"?','¿Qué etapa incluye oficinas o puntos de atención de una empresa?','¿Dónde se distribuyen operaciones entre sedes comerciales?','¿Qué etapa representa establecimientos de una misma organización en distintas zonas?','¿Qué etapa acerca la presencia de la empresa a distintos territorios?']],

['Almacenamiento',['¿Qué significa en español: "STORAGE or WAREHOUSING"?','¿Qué etapa resguarda las mercaderías en bodega?','¿Dónde se organizan las mercaderías en estanterías o bodegas?','¿Cuál etapa controla la ubicación física de productos guardados?','¿Qué etapa conserva productos antes de su salida?']],

['Venta',['¿Qué significa en español: "SALE"?','¿Qué etapa concreta la operación comercial con el cliente?','¿En qué etapa se ofrece un producto y se acuerda su compra?','¿Qué etapa relaciona la oferta de productos con la demanda del consumidor?','¿Cuál etapa registra la decisión del cliente de comprar?']],

['Facturación',['¿Qué significa en español: "BILLING"?','¿Qué etapa emite el documento tributario de una operación?','¿Dónde se genera la factura por una venta?','¿Cuál etapa formaliza documentalmente el cobro?','¿Qué etapa documenta costos e impuestos de la transacción?']],

['Entregas',['¿Qué significa en español: "DELIVERY or DELIVERIES"?','¿En qué etapa se pone finalmente el pedido en manos del destinatario?','¿Cuál etapa confirma la recepción de un pedido por el cliente?','¿Qué etapa corresponde al reparto final de los productos?','¿Qué etapa culmina cuando el comprador recibe sus mercaderías?','¿Dónde finaliza el flujo de insumos de la cadena?']]
]
.forEach(([s,arr])=>arr.forEach(q=>add(s,q)));


// Vocabulario logístico general: sustituir o ampliar con el texto de la página 12 cuando esté disponible.
[
['Materias primas','¿Cómo se llama la etapa asociada al abastecimiento de insumos iniciales?'],
['Producción','¿A qué etapa corresponde el término manufactura?'],
['Transporte','¿Qué etapa se asocia con el concepto de flete?'],
['Agencias o Sucursales','¿Qué etapa corresponde a una sede comercial dependiente de la empresa?'],
['Almacenamiento','¿Qué etapa se relaciona con el concepto de inventario en bodega?'],
['Venta','¿Qué etapa se relaciona directamente con una transacción comercial?'],
['Facturación','¿Qué etapa se relaciona con un comprobante tributario de venta?'],
['Entregas','¿Qué etapa se asocia con la recepción final del pedido?']
]
.forEach(([s,q])=>add(s,q));

function shuffle(a){
for(let i=a.length-1;i>0;i--){const j=Math.floor(Math.random()*(i+1));[a[i],a[j]]=[a[j],a[i]]}return a}
const bank=shuffle([...questions]);
let index=0,correct=0,incorrect=0,seconds=120,locked=true,ended=false,timer=null,pending=null;
const el=id=>document.getElementById(id),overlay=el('overlay'),popup=el('popup');

function showQuestion(){
if(ended)return;
locked=false;
const q=bank[index];
//el('progress').textContent=`PREGUNTA ${index+1} DE ${bank.length}`;
el('question').textContent=q.prompt;

//el('picture').src=`cadena_assets/etapa${stages.indexOf(q.stage)+1}.png`;
//el('picture').src=`imagenes/etapa${stages.indexOf(q.stage)+1}.png`;


// Seleccionar la imagen correspondiente a cada etapa
let numeroImagen = stages.indexOf(q.stage) + 1;

// Intercambiar las imágenes de las etapas 4 y 5
if (q.stage === 'Almacenamiento') {
  numeroImagen = 4;
} 
else if (q.stage === 'Agencias o Sucursales') {
  numeroImagen = 5;
}

// Mostrar la imagen seleccionada
el('picture').src = `imagenes/etapa${numeroImagen}.png`;


const alternatives=shuffle([q.stage,...shuffle(stages.filter(s=>s!==q.stage)).slice(0,2)]);
const area=el('answers');area.replaceChildren();
const colors=shuffle(['red','blue','black','green','yellow','aqua']).slice(0,3);alternatives.forEach((a,i)=>{const b=document.createElement('button');
b.className='answer '+colors[i];
b.textContent=a;
b.onclick=()=>respond(a===q.stage);
area.appendChild(b)})
}

function grade(){
const p=correct/bank.length;
return (p<.6?1+3*p/.6:4+3*(p-.6)/.4).toFixed(1).replace('.',',')}

function finish(){
if(ended)return;
ended=true;
locked=true;clearInterval(timer);
clearTimeout(pending);
document.querySelectorAll('.answer').forEach(b=>b.disabled=true);
popup.className='final';
popup.innerHTML=`<div class="label">NOTA FINAL</div><div class="grade">${grade()}</div>`;
overlay.hidden=false
}

function respond(ok){
if(locked||ended)return;locked=true;document.querySelectorAll('.answer').forEach(b=>b.disabled=true);if(ok)correct++;else incorrect++;index++;el('right').textContent=correct;el('wrong').textContent=incorrect;el('done').textContent=index;popup.textContent=ok?'✔️':'❌';popup.className='symbol '+(ok?'good':'bad');overlay.hidden=false;pending=setTimeout(()=>{if(ended)return;overlay.hidden=true;if(index>=bank.length)finish();else showQuestion()},300)}


function start(){

  // Ocultar la ventana de bienvenida
  el('introOverlay').hidden = true;

  // Mostrar el camión con zoom durante 1 segundo
  popup.textContent = '🚚';
  popup.className = 'symbol start';
  overlay.hidden = false;

  // Iniciar las preguntas después de la animación
  setTimeout(() => {

    if(ended) return;

    overlay.hidden = true;

    showQuestion();

    // Iniciar la cuenta regresiva de 120 segundos
    timer = setInterval(() => {

      if(ended) return;

      seconds--;
      el('time').textContent = seconds;

      if(seconds <= 0){
        finish();
      }

    }, 1000);

  }, 1000);
}

// Esperar a que el estudiante presione ACEPTAR
window.addEventListener('load', () => {

  el('introOverlay').hidden = false;

  el('acceptButton').addEventListener('click', start);

});


</script>
</body>
</html>
